<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/perfume-cosmetics-store/Diamond-Emoji.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXE BEAUTY | Цифровой парфюмерный бутик</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- БАЗОВЫЕ СТИЛИ ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0A0A;
      color: #E8E6E1;
      overflow-x: hidden;
    }
    
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    
    /* ---------- ЦВЕТА ---------- */
    .text-gold { color: #D4AF37; }
    .border-gold { border-color: #D4AF37; }
    .bg-gold { background-color: #D4AF37; }
    .hover\:bg-gold:hover { background-color: #D4AF37; }
    .hover\:text-gold:hover { color: #D4AF37; }
    .hover\:border-gold:hover { border-color: #D4AF37; }
    
    /* ---------- АНИМАЦИИ ---------- */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes fadeRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }
    
    @keyframes cursor {
      from, to { border-color: transparent; }
      50% { border-color: #D4AF37; }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .animate-fade-in { animation: fadeIn 1s ease forwards; }
    .animate-fade-up { animation: fadeUp 0.8s ease forwards; }
    .animate-fade-left { animation: fadeLeft 0.8s ease forwards; }
    .animate-fade-right { animation: fadeRight 0.8s ease forwards; }
    .animate-scale { animation: scaleIn 0.6s ease forwards; }
    .animate-float { animation: float 5s ease-in-out infinite; }
    
    /* Эффект печати */
    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #D4AF37;
      animation: typewriter 1.5s steps(30, end), cursor 0.75s step-end infinite;
    }
    
    /* Блеск */
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    
    /* ---------- ПОЯВЛЕНИЕ ПРИ СКРОЛЛЕ ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }
    
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    
    .reveal-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: all 0.8s ease;
    }
    
    .reveal-left.active {
      opacity: 1;
      transform: translateX(0);
    }
    
    .reveal-right {
      opacity: 0;
      transform: translateX(40px);
      transition: all 0.8s ease;
    }
    
    .reveal-right.active {
      opacity: 1;
      transform: translateX(0);
    }
    
    .reveal-scale {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s ease;
    }
    
    .reveal-scale.active {
      opacity: 1;
      transform: scale(1);
    }
    
    /* Задержки */
    .delay-100 { transition-delay: 0.1s; }
    .delay-200 { transition-delay: 0.2s; }
    .delay-300 { transition-delay: 0.3s; }
    .delay-400 { transition-delay: 0.4s; }
    .delay-500 { transition-delay: 0.5s; }
    
    /* ---------- КАСТОМНЫЙ СКРОЛЛБАР ---------- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1A1A1A; }
    ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 2px; }
    
    /* ---------- КНОПКИ ---------- */
    .btn-outline-gold {
      border: 1px solid rgba(212, 175, 55, 0.5);
      padding: 12px 28px;
      border-radius: 9999px;
      transition: all 0.3s ease;
    }
    
    .btn-outline-gold:hover {
      border-color: #D4AF37;
      background: rgba(212, 175, 55, 0.1);
    }
    
    .btn-underline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #D4AF37;
      padding-bottom: 4px;
      transition: all 0.3s ease;
    }
    
    .btn-underline:hover {
      gap: 12px;
      color: #D4AF37;
    }
    
    /* ---------- КАРТОЧКИ ---------- */
    .card-dark {
      background: #111111;
      border: 1px solid #222;
      border-radius: 24px;
      transition: all 0.4s ease;
    }
    
    .card-dark:hover {
      border-color: #D4AF37;
      transform: translateY(-4px);
    }
    
    /* ---------- ВИДЕО КОНТЕЙНЕР ---------- */
    .video-container {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
    }
    
    .video-container video {
      transition: transform 0.7s ease;
    }
    
    .video-container:hover video {
      transform: scale(1.05);
    }
    
    /* ---------- ФОРМЫ ---------- */
    input, textarea {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      transition: all 0.3s ease;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #D4AF37;
    }
    
    input::placeholder, textarea::placeholder {
      color: #555;
    }
    /* Отзывы */
    .testimonial-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 24px;
      padding: 32px;
      transition: all 0.4s ease;
    }
    
    .testimonial-card:hover {
      border-color: #D4AF37;
      transform: translateY(-4px);
    }
    
    .quote-icon {
      font-size: 48px;
      line-height: 1;
      color: rgba(212, 175, 55, 0.3);
      margin-bottom: 20px;
    }
    
    /* Подвал */
    .footer-link {
      color: #888;
      transition: color 0.3s ease;
    }
    
    .footer-link:hover {
      color: #D4AF37;
    }
    
    .social-icon {
      width: 40px;
      height: 40px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .social-icon:hover {
      background: #D4AF37;
      transform: translateY(-2px);
    }
    
    .social-icon:hover span {
      color: #0A0A0A;
    }
    
    /* Видео-отзывы */
    .video-testimonial {
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    
    .video-testimonial:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
    }

  </style>
  <script type="module" crossorigin src="/perfume-cosmetics-store/assets/index-C3heCteX.js"></script>
  <link rel="stylesheet" crossorigin href="/perfume-cosmetics-store/assets/index-CNYVR8Za.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
